name: Daily Market Pulse Report

on:
  schedule:
    # 2:30 AM UTC = 8:00 AM IST, Monday–Friday only
    - cron: '30 2 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI anytime

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance google-generativeai requests pytz

      - name: Check if market is open today
        id: market_check
        run: |
          python3 -c "
          from datetime import date
          import pytz
          from datetime import datetime
          ist = pytz.timezone('Asia/Kolkata')
          now = datetime.now(ist)
          # NSE holidays 2026 (add more as needed)
          holidays = [
              date(2026, 1, 26),  # Republic Day
              date(2026, 3, 17),  # Holi
              date(2026, 4, 2),   # Ram Navami
              date(2026, 4, 14),  # Dr. Ambedkar Jayanti
              date(2026, 5, 1),   # Maharashtra Day
              date(2026, 8, 15),  # Independence Day
              date(2026, 10, 2),  # Gandhi Jayanti
              date(2026, 11, 4),  # Diwali Laxmi Puja
              date(2026, 12, 25), # Christmas
          ]
          today = now.date()
          is_open = now.weekday() < 5 and today not in holidays
          print(f'MARKET_OPEN={str(is_open).lower()}')
          " >> \$GITHUB_OUTPUT

      - name: Generate daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/generate_report.py

      - name: Commit and push updated report
        run: |
          git config --local user.email "marketpulse-bot@github.com"
          git config --local user.name "Market Pulse Bot"
          git add data/report.json
          git diff --staged --quiet || git commit -m "📊 Daily report — $(date +'%d %b %Y, %H:%M IST')"
          git push

      - name: Report success
        if: success()
        run: echo "✅ Market Pulse report generated and deployed successfully"

      - name: Report failure
        if: failure()
        run: echo "❌ Report generation failed — check logs above"
